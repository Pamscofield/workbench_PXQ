<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<title>Workbench</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<!-- iOS: add-to-home-screen behaves like an app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workbench">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<link rel="stylesheet" href="style.css">
<noscript><style>body{background:#0f1115;color:#e8ecf3;font-family:sans-serif;padding:40px}</style></noscript>
</head>
<body>
<!-- If style.css/app.js are missing (this file copied out on its own), show why
     instead of a blank page. JS removes it as soon as the app boots. -->
<div id="loaderr" style="position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;
  z-index:99999;background:#0f1115;color:#e8ecf3;overflow:auto;
  font:15px/1.7 -apple-system,'PingFang SC',sans-serif;padding:34px 24px;margin:0">
  <div style="max-width:460px;margin:8vh auto">
    <div style="font-size:38px;margin-bottom:14px">📄</div>
    <h2 style="margin:0 0 12px;font-size:19px">这个文件不能单独打开</h2>
    <p style="color:#8b94a6;margin:0 0 18px">
      <code>index.html</code> 需要同目录下的 <code>style.css</code>、<code>app.js</code> 和
      <code>data/</code> 文件夹，单独复制出来就会白屏。
    </p>
    <p style="margin:0 0 8px"><b>要发到手机 / 单独打开，请用：</b></p>
    <p style="background:#1d222b;border:1px solid #262c37;border-radius:10px;padding:12px 14px;margin:0">
      <b style="color:#5b9cff">workbench.html</b><br>
      <span style="color:#8b94a6;font-size:13px">同一个文件夹里，所有内容都打包在一个文件内，可直接 AirDrop / 微信发到手机。</span>
    </p>
  </div>
</div>
<header class="topbar">
  <button id="menuBtn" class="iconbtn" aria-label="menu">☰</button>
  <h1 id="title">工作台</h1>
  <button id="update-btn" class="ghost" hidden>检查更新</button>
</header>

<div class="layout">
  <div id="scrim" class="scrim"></div>
  <nav id="sidebar" class="sidebar">
    <div class="brand">Workbench</div>
    <button class="navitem active" data-view="ai"><span>🤖</span> AI 情报</button>
    <button class="navitem" data-view="de"><span>🇩🇪</span> 德语打卡</button>
    <button class="navitem" data-view="fc"><span>🃏</span> 单词翻页</button>
    <div class="spacer"></div>
    <div class="hint">数据由 Hermes 定时更新<br>可离线查看</div>
  </nav>

  <main class="content">
    <section id="view-ai" class="view active">
      <div class="viewhead">
        <h2>AI 情报</h2>
        <span class="headright">
          <span id="ai-date" class="muted"></span>
          <button id="ai-refresh" class="ghost">↻ 刷新</button>
        </span>
      </div>
      <div id="ai-list" class="cards"><div class="empty">加载中…</div></div>
    </section>

    <section id="view-de" class="view">
      <div class="viewhead">
        <h2>德语打卡 · A2</h2>
        <span class="headright">
          <span id="de-date" class="muted"></span>
          <span id="de-streak" class="pill">连续 0 天</span>
          <button id="de-refresh" class="ghost">↻ 刷新</button>
        </span>
      </div>
      <div id="de-list" class="cards"><div class="empty">加载中…</div></div>
      <button id="de-done" class="primary">✅ 今天完成打卡</button>
    </section>

    <section id="view-fc" class="view">
      <div class="viewhead">
        <h2>单词翻页</h2>
        <span class="muted">✔ <b id="fc-ok">0</b> · ✘ <b id="fc-no">0</b> · 剩 <b id="fc-left">0</b></span>
      </div>

      <div class="fcbar">
        <label>方向
          <select id="fc-dir">
            <option value="de2en">德 → 英</option>
            <option value="en2de">英 → 德</option>
            <option value="mix">混合</option>
          </select>
        </label>
        <label>范围
          <select id="fc-src">
            <option value="all">全部</option>
            <option value="news">打卡生词</option>
            <option value="A2">A2 常用</option>
            <option value="noun">只练名词冠词</option>
          </select>
        </label>
        <button id="fc-reset" class="ghost">重新开始</button>
      </div>

      <div id="fc-card" class="flashcard">
        <div class="fc-inner">
          <div class="fc-face fc-front">
            <div class="fc-q" id="fc-q">—</div>
            <div class="fc-hint" id="fc-hint"></div>
            <div id="fc-art" class="artrow" hidden>
              <button data-art="der">der</button>
              <button data-art="die">die</button>
              <button data-art="das">das</button>
            </div>
            <div class="fc-tap" id="fc-tap">点击卡片翻面</div>
          </div>
          <div class="fc-face fc-back">
            <div class="fc-a" id="fc-a">—</div>
            <div class="fc-extra" id="fc-extra"></div>
          </div>
        </div>
      </div>

      <div class="fcgrade" id="fc-grade" hidden>
        <button class="bad" data-g="0">✘ 不会</button>
        <button class="good" data-g="1">✔ 会了</button>
      </div>
      <p class="muted" id="fc-done" hidden>🎉 这一轮练完了，点「重新开始」再来一轮。</p>
    </section>
  </main>
</div>

<script id="embed-de" type="application/json">{"updated": "2026-08-15", "level": "A2", "mix": "Jena lokal · Einfache Deutsch · National", "items": [{"source": "Jenaer Nachrichten", "cat": "Jena lokal", "url": "https://www.jenaer-nachrichten.de/stadtleben/29575-buergerservice-jena-raetselhafter-gasalarm-in-tiefgarage", "date": "2026-08-15", "de": "Am Freitag kam es in der Tiefgarage des Jenaer Buergerdienstes zu einem Gasalarm. Die Feuerwehr und ein technisches Hilfskraft-Zug waren im Einsatz. Der Grund fuer den Alarm ist noch unklar.", "cn": "周五（15日）在耶拿市民服务中心的地下停车场发生了气体警报。消防队和技术救援队出动了。警报原因尚不清楚。", "words": [{"w": "Am Freitag", "m": "周五（der Freitag 男性，复数 die Freitage；am = an dem）", "pl": "die Freitage"}, {"w": "kam es zu", "m": "发生了（es = 形式主语；zu einem Gasalarm 来了一个气体警报；kommen zu + Dativ 表“发生……事情”）", "pl": "—", "note": "es kommt zu etwas = something happens / there is"}, {"w": "einem Gasalarm", "m": "气体警报（der Alarm 男性，警报；Gas 气体；Gasalarm 复合词；ein + Dativ 因前面有 zu）", "pl": "die Gasalarme"}, {"w": "der Tiefgarage", "m": "地下停车场（die Tiefgarage 女性，地下车库；Tief 深的 + Garage 车库；这里用第三格，因为在……里面）", "pl": "die Tiefgaren"}, {"w": "des Buergerdienstes", "m": "市民服务中心的（der Buergerdienst 男性，市民服务；des = 第三格属格，表示所属关系）", "pl": "die Buergerdienste"}, {"w": "die Feuerwehr", "m": "消防队（负冠词 die，女性名词；Feuer 火，Wehr 防御）", "pl": "—"}, {"w": "ein technisches Hilfskraft-Zug", "m": "技术救援队（der Zug 男性，此处指“一队/一组”；technisch 技术的；Hilfskraft 救援人员/援助力量；复合词）", "pl": "die Zuege"}, {"w": "war im Einsatz", "m": "正在执行任务/出动了（sein + im + 第四格；im Einsatz sein = to be in action / deployed）", "pl": "—"}, {"w": "Der Grund", "m": "原因（der Grund 男性，复数 die Gruende；Grund  grounds/reason）", "pl": "die Gruende"}, {"w": "fuer den Alarm", "m": "警报的原因（fuer = für，第四格介词；der Alarm 男性）", "pl": "—"}, {"w": "ist noch unklar", "m": "仍不清楚（noch 还/仍然；unklar 不清楚的，形容词）", "pl": "—"}], "grammar": "kommen zu + Dativ: 'es kam zu einem Gasalarm' = there was a gas alarm（发生某事的固定表达，其中 es 是形式主语）。属格第三格: 'des Buergerdienstes' = of the citizen service（名词间所属關係的古典表示法，現代口語多用 von + Dativ，但書面新聞仍常用）；注意 der Buergerdienst 是陽性。sein im Einsatz: 固定短語表示“執行任務/出動”，im = in dem（第三格），Einsatz 男性。 noch unklar: 形容詞作表語，不變格。"}, {"source": "nachrichtenleicht (DLF)", "cat": "Einfache Deutsch", "url": "https://www.nachrichtenleicht.de/recht-reparatur-100.html", "date": "2026-08-15", "de": "Ab jetzt muessen Hersteller mehr kaputte Elektro-Geraete reparieren. Das steht in einem Gesetz. Das Gesetz nennt man 'Recht auf Reparatur'.", "cn": "从现在起，厂商必须修复更多损坏的电器。这写在一项法律里。这项法律叫做“维修权”。", "words": [{"w": "Ab jetzt", "m": "从现在起（ab + Dativ 表起点；jetzt = 现在）", "pl": "—", "note": "ab jetzt = from now on"}, {"w": "muessen", "m": "必须（mussen 情态动词，复数/第一第二人称单数型；这里主语是 Hersteller 复数）", "pl": "—"}, {"w": "Hersteller", "m": "厂商、制造商（der Hersteller 男性，复数 die Hersteller；herstellen 制造/生产）", "pl": "die Hersteller"}, {"w": "mehr kaputte Elektro-Geraete", "m": "更多损坏的电器（mehr 更多；kaputt 坏的/损坏的，形容词；die Elektro-Geraete 电器，复数；kaputte 是 형용사复数弱变化 -e）", "pl": "die Elektro-Geraete"}, {"w": "reparieren", "m": "修复（动词，不定式；英语 repair）", "pl": "—"}, {"w": "Das steht in einem Gesetz", "m": "这写在一项法律里（stehen + Dativ 表“位于/记载于”；das = dieses Gesetz；in einem Gesetz = in einem Gesetz（第三格，因为表示位于内部））", "pl": "—"}, {"w": "nennt man", "m": "人们称之为（man = 人们/一般主语；nennen 叫做/命名；man nennt = people call）", "pl": "—"}, {"w": "Recht auf Reparatur", "m": "维修权（das Recht 法律权利/权利，中性；auf + Dativ？实为固定搭配 Recht auf + Akk？此处联合结构；Reparatur 修复/维修，女性）", "pl": "—", "note": "Recht auf + Akkusativ = right to (do something)"}], "grammar": "情態動詞 mussen: 'Hersteller muessen reparieren' = 主詞複數配 mussen（複數形式），實義動詞 reparieren 放句末不定式。介詞 in + Dativ（介於內部）：'in einem Gesetz' = in a law（法律之中）。にも関わらず、英語からは 'in a law' となるが、ドイツ語では Dativ。接続詞構造 'Das Gesetz, das man nennt...' 的相對從句説明性名詞（被省略），這裡改用主句 'Das Gesetz nennt man...'。 'Recht auf Reparatur': auf + Akkusativ 在此为固定法律用語（權利指向的動作），對應英語 right to repair。"}, {"source": "tagesschau", "cat": "National", "url": "https://www.tagesschau.de/inland/niedrigwasser-folgen-bahn-preise-100.html", "date": "2026-08-15", "de": "Der Rhein hat wenig Wasser. Die Schifffahrt ist stark eingeschraenkt. Die Deutsche Bahn will alte Gueterwaggons wieder nutzen, um mehr Guter auf die Schiene zu verlegen.", "cn": "莱茵河水位很低。航运受到严重限制。德国铁路计划重新使用旧货运车厢，把更多货物转运到铁路上。", "words": [{"w": "Der Rhein", "m": "莱茵河（der Rhein 男性，德国最长的河流名称）", "pl": "—"}, {"w": "hat wenig Wasser", "m": "水位很低/水很少（wenig 少的；Wasser 水，中性）", "pl": "—"}, {"w": "Die Schifffahrt", "m": "航运/水上运输（die Schifffahrt 女性；Schiff 船 + Fahrt 旅程/行程）", "pl": "—"}, {"w": "ist stark eingeschraenkt", "m": "受到严重限制（stark 强烈地/严重地；eingeschraenkt 是 einschraenken 限制的过去分词，构成被动完成 'ist ... eingeschraenkt worden' 的简略）", "pl": "—", "note": "eingeschraenkt = restricted (Partizip II)"}, {"w": "Die Deutsche Bahn", "m": "德国铁路（die Deutsche Bahn 女性，德国国家铁路公司简称 DB）", "pl": "—"}, {"w": "will", "m": "计划/想要（wollen 的第三人称单数现在时形式；这里表示“打算、计划”而非单纯“想要”）", "pl": "—"}, {"w": "alte Gueterwaggons", "m": "旧货运车厢（der Gueterwaggon 男性，货运车箱/货车辆；alt 旧的，复数 alte；Gueter 货物 + Waggon 车厢）", "pl": "die Gueterwaggons"}, {"w": "wieder nutzen", "m": "再次使用（wieder 再次；nutzen 使用，动词不定式）", "pl": "—"}, {"w": "um ... zu verlegen", "m": "为了转运（um ... zu = 目的结构，相当于“为了……”；verlegen 迁移/转运/布置，此处指把货物从水路转到铁路）", "pl": "—", "note": "um ... zu + Infinitiv = in order to ..."}, {"w": "mehr Guter", "m": "更多货物（mehr 更多；die Gueter 货物，复数，通常不数）", "pl": "—"}, {"w": "auf die Schiene", "m": "到轨道/铁路上（auf + 第四格，因为是方向/移动指向的目标；die Schiene 女性，轨道/铁路）", "pl": "die Schienen", "note": "auf + Akkusativ for direction (movement onto the rails)"}], "grammar": "被动完成簡化表达: 'ist eingeschraenkt' 實際是 'ist ... eingeschraenkt worden'（Vorgangspassiv Perfekt）的簡略新聞體， gebraucht ohne 'worden' 在報導裡很常見。情態動作 'will ... nutzen': wollen 表計劃/意圖（not just desire），搭配不定式放在句末。目的結構 'um ... zu + Infinitiv': 'um mehr Guter auf die Schiene zu verlegen' = in order to shift more goods onto the rails（目的從句替代結構）。介詞方向用法: 'auf die Schiene' 用第四格，因為是移動的目標方向。生態/物流主題對 A2 實用——河流、運輸、貨運。"}]}</script>
