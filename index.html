<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<title>Workbench</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<!-- iOS: add-to-home-screen behaves like an app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workbench">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<link rel="stylesheet" href="style.css">
<noscript><style>body{background:#0f1115;color:#e8ecf3;font-family:sans-serif;padding:40px}</style></noscript>
</head>
<body>
<!-- If style.css/app.js are missing (this file copied out on its own), show why
     instead of a blank page. JS removes it as soon as the app boots. -->
<div id="loaderr" style="position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;
  z-index:99999;background:#0f1115;color:#e8ecf3;overflow:auto;
  font:15px/1.7 -apple-system,'PingFang SC',sans-serif;padding:34px 24px;margin:0">
  <div style="max-width:460px;margin:8vh auto">
    <div style="font-size:38px;margin-bottom:14px">📄</div>
    <h2 style="margin:0 0 12px;font-size:19px">这个文件不能单独打开</h2>
    <p style="color:#8b94a6;margin:0 0 18px">
      <code>index.html</code> 需要同目录下的 <code>style.css</code>、<code>app.js</code> 和
      <code>data/</code> 文件夹，单独复制出来就会白屏。
    </p>
    <p style="margin:0 0 8px"><b>要发到手机 / 单独打开，请用：</b></p>
    <p style="background:#1d222b;border:1px solid #262c37;border-radius:10px;padding:12px 14px;margin:0">
      <b style="color:#5b9cff">workbench.html</b><br>
      <span style="color:#8b94a6;font-size:13px">同一个文件夹里，所有内容都打包在一个文件内，可直接 AirDrop / 微信发到手机。</span>
    </p>
  </div>
</div>
<header class="topbar">
  <button id="menuBtn" class="iconbtn" aria-label="menu">☰</button>
  <h1 id="title">工作台</h1>
  <button id="update-btn" class="ghost" hidden>检查更新</button>
</header>

<div class="layout">
  <div id="scrim" class="scrim"></div>
  <nav id="sidebar" class="sidebar">
    <div class="brand">Workbench</div>
    <button class="navitem active" data-view="ai"><span>🤖</span> AI 情报</button>
    <button class="navitem" data-view="de"><span>🇩🇪</span> 德语打卡</button>
    <button class="navitem" data-view="fc"><span>🃏</span> 单词翻页</button>
    <div class="spacer"></div>
    <div class="hint">数据由 Hermes 定时更新<br>可离线查看</div>
  </nav>

  <main class="content">
    <section id="view-ai" class="view active">
      <div class="viewhead">
        <h2>AI 情报</h2>
        <span class="headright">
          <span id="ai-date" class="muted"></span>
          <button id="ai-refresh" class="ghost">↻ 刷新</button>
        </span>
      </div>
      <div id="ai-list" class="cards"><div class="empty">加载中…</div></div>
    </section>

    <section id="view-de" class="view">
      <div class="viewhead">
        <h2>德语打卡 · A2</h2>
        <span class="headright">
          <span id="de-date" class="muted"></span>
          <span id="de-streak" class="pill">连续 0 天</span>
          <button id="de-refresh" class="ghost">↻ 刷新</button>
        </span>
      </div>
      <div id="de-list" class="cards"><div class="empty">加载中…</div></div>
      <button id="de-done" class="primary">✅ 今天完成打卡</button>
    </section>

    <section id="view-fc" class="view">
      <div class="viewhead">
        <h2>单词翻页</h2>
        <span class="muted">✔ <b id="fc-ok">0</b> · ✘ <b id="fc-no">0</b> · 剩 <b id="fc-left">0</b></span>
      </div>

      <div class="fcbar">
        <label>方向
          <select id="fc-dir">
            <option value="de2en">德 → 英</option>
            <option value="en2de">英 → 德</option>
            <option value="mix">混合</option>
          </select>
        </label>
        <label>范围
          <select id="fc-src">
            <option value="all">全部</option>
            <option value="news">打卡生词</option>
            <option value="A2">A2 常用</option>
            <option value="noun">只练名词冠词</option>
          </select>
        </label>
        <button id="fc-reset" class="ghost">重新开始</button>
      </div>

      <div id="fc-card" class="flashcard">
        <div class="fc-inner">
          <div class="fc-face fc-front">
            <div class="fc-q" id="fc-q">—</div>
            <div class="fc-hint" id="fc-hint"></div>
            <div id="fc-art" class="artrow" hidden>
              <button data-art="der">der</button>
              <button data-art="die">die</button>
              <button data-art="das">das</button>
            </div>
            <div class="fc-tap" id="fc-tap">点击卡片翻面</div>
          </div>
          <div class="fc-face fc-back">
            <div class="fc-a" id="fc-a">—</div>
            <div class="fc-extra" id="fc-extra"></div>
          </div>
        </div>
      </div>

      <div class="fcgrade" id="fc-grade" hidden>
        <button class="bad" data-g="0">✘ 不会</button>
        <button class="good" data-g="1">✔ 会了</button>
      </div>
      <p class="muted" id="fc-done" hidden>🎉 这一轮练完了，点「重新开始」再来一轮。</p>
    </section>
  </main>
</div>

<script id="embed-de" type="application/json">{"updated": "2026-08-18", "level": "A2", "mix": "Jena lokal · Einfache Deutsch · National", "items": [{"source": "Jenaer Nachrichten", "cat": "Jena lokal", "url": "https://www.jenaer-nachrichten.de/stadtleben/29566-einschulung-in-jena-jena-zaehlt-erneut-weniger-schulanfaenger", "date": "2026-08-18", "de": "In Jena beginnt das neue Schuljahr. Dieses Jahr kommen nur 916 Kinder in die erste Klasse. Die Zahl der Schulanfaenger sinkt in Jena schon seit einigen Jahren.", "cn": "耶拿开始了新学年。今年只有 916 个孩子进入一年级。耶拿的入学儿童数量几年来一直在下降。", "words": [{"w": "In Jena", "m": "在耶拿（in = 在；Jena 耶拿，图林根城市名，专有名词中性）", "pl": "—"}, {"w": "beginnt", "m": "开始（beginnen 的第三人称单数现在时，词尾 -t）", "pl": "—"}, {"w": "das neue Schuljahr", "m": "新学年（das Schuljahr 中性，学年；neu 新的）", "pl": "die Schuljahre"}, {"w": "Dieses Jahr", "m": "今年（dieses = 这个，指示代词；das Jahr 中性，年）", "pl": "die Jahre"}, {"w": "nur 916 Kinder", "m": "只有 916 个孩子（nur 只/仅仅；das Kind 中性，孩子，复数 die Kinder）", "pl": "die Kinder"}, {"w": "in die erste Klasse", "m": "进入一年级（die Klasse 女性，班级；erste 第一的；in + 第四格表示方向“进入”）", "pl": "die Klassen", "note": "in + Akkusativ for movement into"}, {"w": "Die Zahl", "m": "数量/数字（die Zahl 女性，数字/数量）", "pl": "die Zahlen"}, {"w": "der Schulanfaenger", "m": "入学儿童（der Schulanfaenger 男性，刚上学的孩子；Schule 学校 + Anfang 开始）", "pl": "die Schulanfaenger"}, {"w": "sinkt", "m": "下降（sinken 的第三人称单数；此处指数量减少/走低）", "pl": "—"}, {"w": "schon seit einigen Jahren", "m": "几年来一直（schon 已经；seit 自从/……以来，要求第三格；einige Jahre 几年）", "pl": "—", "note": "seit + Dativ = for/since (a duration up to now)"}], "grammar": "Present tense: 'beginnt', 'kommen', 'sinkt' all take the 3rd-person singular -t ending. 'weniger' (fewer) carries the comparison. 'seit' + dative ('seit einigen Jahren') marks a duration continuing into the present — a common A2 time expression. 'in die erste Klasse' uses accusative because it expresses movement into a place."}, {"source": "nachrichtenleicht (DLF)", "cat": "Einfache Deutsch", "url": "https://www.nachrichtenleicht.de/auto-fahrer-umfrage-100.html", "date": "2026-08-18", "de": "Immer mehr Auto-Fahrer sind ungeduldig. Sie aergern sich schneller im Stau oder an der Ampel. Eine Studie zeigt: Die Geduld im Strassenverkehr wird weniger.", "cn": "越来越多的开车人没有耐心。他们在堵车里或红绿灯前更快生气。一项研究表明：道路交通中的耐心正在变少。", "words": [{"w": "Immer mehr", "m": "越来越多（immer = 越来越；mehr = 更多）", "pl": "—"}, {"w": "der Auto-Fahrer", "m": "开车的人/司机（der Fahrer 男性，司机；Auto 汽车；复合词）", "pl": "die Auto-Fahrer"}, {"w": "sind ungeduldig", "m": "没有耐心（sein + ungeduldig 不耐烦的，形容词作表语；un- 否定前缀 + geduldig 有耐心的）", "pl": "—"}, {"w": "Sie aergern sich", "m": "他们生气（sich aergern 生气的反身动词；Sie 他们；sich 反身代词第四格）", "pl": "—", "note": "sich aergern = to get annoyed (reflexive, accusative)"}, {"w": "schneller", "m": "更快地（schnell 快的，比较级加 -er）", "pl": "—"}, {"w": "im Stau", "m": "在堵车中（der Stau 男性，堵车/拥堵；im = in dem）", "pl": "die Staus"}, {"w": "an der Ampel", "m": "在红绿灯处（die Ampel 女性，红绿灯/信号灯；an + 第三格表地点）", "pl": "die Ampeln", "note": "an + Dativ = at (a location)"}, {"w": "Eine Studie", "m": "一项研究（die Studie 女性，研究；eine 不定冠词）", "pl": "die Studien"}, {"w": "zeigt", "m": "显示（zeigen 的第三人称单数；show）", "pl": "—"}, {"w": "Die Geduld", "m": "耐心（die Geduld 女性，耐心；来自形容词 geduldig）", "pl": "—"}, {"w": "im Strassenverkehr", "m": "在道路交通中（der Verkehr 男性，交通；die Strasse 女性，街道；复合词 Strassenverkehr）", "pl": "—"}, {"w": "wird weniger", "m": "变少（werden 变得/变成；weniger 更少；werden 作实义动词“变得”）", "pl": "—"}], "grammar": "Reflexive verb 'sich aergern' takes a reflexive pronoun in the accusative ('sich'). 'immer mehr' = increasingly many (a set comparative phrase). 'an der Ampel' uses 'an' + dative for location. 'werden' here is a full verb meaning 'to become' (Die Geduld ... wird weniger), not the future auxiliary."}, {"source": "tagesschau", "cat": "National", "url": "https://www.tagesschau.de/inland/regional/hamburg/tarifstreit-warnstreik-in-seehaefen,seehaefen-112.html", "date": "2026-08-18", "de": "In deutschen Seehaefen gibt es einen Warnstreik. Die Hafen-Arbeiter wollen mehr Geld vom Arbeitgeber. Viele Schiffe muessen jetzt warten.", "cn": "在德国的海港里发生了警告性罢工。港口工人想从雇主那里得到更多钱。许多船只现在必须等待。", "words": [{"w": "In deutschen Seehaefen", "m": "在德国的海港里（der Seehafen 男性，海港；deutsch 德国的，复数第三格形容词词尾 -en；See 海 + Hafen 港口）", "pl": "die Seehaefen"}, {"w": "gibt es", "m": "有/存在（es gibt = 有/there is/are；geben 给；es 形式主语）", "pl": "—", "note": "es gibt + Akkusativ = there is/are"}, {"w": "einen Warnstreik", "m": "一次警告性罢工（der Streik 男性，罢工；Warnung 警告 + Streik；einen 第四格，因 es gibt 要求第四格）", "pl": "die Warnstreiks"}, {"w": "Die Hafen-Arbeiter", "m": "港口工人（der Arbeiter 男性，工人；der Hafen 男性，港口；复合词）", "pl": "die Hafen-Arbeiter"}, {"w": "wollen mehr Geld", "m": "想要更多钱（wollen 想要，情态动词；das Geld 中性，钱；mehr 更多）", "pl": "—"}, {"w": "vom Arbeitgeber", "m": "从雇主那里（der Arbeitgeber 男性，雇主；von + 第三格 = 从；vom = von dem）", "pl": "die Arbeitgeber", "note": "von + Dativ = from"}, {"w": "Viele Schiffe", "m": "许多船只（das Schiff 中性，船，复数 die Schiffe，以 -ff/-sch 结尾的名词复数常加 -e）", "pl": "die Schiffe"}, {"w": "muessen ... warten", "m": "必须等待（muessen 必须，情态动词；warten 等待，不定式放句末）", "pl": "—", "note": "modal verb + infinitive at clause end"}, {"w": "jetzt", "m": "现在（时间副词）", "pl": "—"}], "grammar": "'es gibt' always takes the accusative ('einen Warnstreik'). Modal verbs 'wollen' and 'muessen' push their infinitive ('warten') to the end of the clause. 'von + dative' = from ('vom Arbeitgeber'). Plural of 'das Schiff' is 'die Schiffe' (nouns ending in -ff/-sch add -e in plural). Adjective ending '-en' after 'in deutschen Seehaefen' (plural dative)."}]}</script>
