<style>
:root{
  --bg:#0f1115; --panel:#161a21; --panel2:#1d222b; --line:#262c37;
  --txt:#e8ecf3; --muted:#8b94a6; --acc:#5b9cff; --ok:#43d17c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif}
.topbar{display:none;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:20}
.topbar h1{font-size:16px;margin:0}
.iconbtn{background:none;border:0;color:var(--txt);font-size:20px}
.layout{display:flex;min-height:100%}
.sidebar{width:220px;flex:0 0 220px;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:6px}
.brand{font-weight:700;letter-spacing:.5px;padding:6px 10px 16px;color:var(--muted);font-size:13px;text-transform:uppercase}
.navitem{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--txt);text-align:left;padding:11px 12px;border-radius:10px;font-size:15px;cursor:pointer}
.navitem:hover{background:var(--panel2)}
.navitem.active{background:var(--acc);color:#08111f;font-weight:600}
.spacer{flex:1}
.hint{color:var(--muted);font-size:12px;padding:10px}
.content{flex:1;padding:26px 30px 60px;max-width:900px}
.viewhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.headright{display:flex;align-items:center;gap:10px}
h2{margin:0;font-size:22px}
.muted{color:var(--muted);font-size:13px}
.pill{background:var(--panel2);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-size:12px;color:var(--ok)}
.view{display:none}
.view.active{display:block}
.cards{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card h3{margin:0 0 6px;font-size:16px}
.card a{color:var(--acc);text-decoration:none;font-size:13px}
.card .src{color:var(--muted);font-size:12px;margin-bottom:8px}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);color:var(--acc);padding:1px 8px;border-radius:999px;font-size:11px;margin:0 4px}
.de-sent{font-size:17px;font-weight:600;margin:2px 0 6px}
.de-cn{color:#cfd7e6;margin:0 0 10px}
table.words{width:100%;border-collapse:collapse;font-size:14px}
table.words td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
table.words td:first-child{white-space:nowrap;color:var(--acc);font-weight:600;width:34%}
.gram{margin-top:10px;padding:10px 12px;background:var(--panel2);border-radius:10px;font-size:13px;color:#cfd7e6}
.empty{color:var(--muted);padding:20px 0}
.primary{margin-top:20px;background:var(--ok);color:#062312;border:0;padding:12px 18px;border-radius:12px;font-weight:700;font-size:15px}
/* flashcards */
.fcbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px;font-size:13px;color:var(--muted)}
.fcbar select{margin-left:6px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:14px}
.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer}
.flashcard{perspective:1200px;width:100%;max-width:520px;height:260px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.fc-back{transform:rotateY(180deg)}
.fc-q{font-size:30px;font-weight:700}
.fc-a{font-size:26px;font-weight:700;color:var(--ok)}
.fc-hint{font-size:13px;color:var(--muted)}
.fc-extra{font-size:14px;color:#cfd7e6;line-height:1.9}
.fc-tap{position:absolute;bottom:12px;font-size:12px;color:var(--muted)}
.artrow{display:flex;gap:10px;margin-top:6px}
.artrow button{min-width:74px;padding:10px 0;font-size:16px;font-weight:700;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.artrow button.right{background:var(--ok);color:#062312;border-color:var(--ok)}
.artrow button.wrong{background:#ff5d6c;color:#2a0409;border-color:#ff5d6c}
.artrow button:disabled{cursor:default;opacity:.95}
.fcgrade{display:flex;gap:12px;margin-top:18px;max-width:520px}
.fcgrade button{flex:1;padding:13px 0;border:0;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
.fcgrade .good{background:var(--ok);color:#062312}
.fcgrade .bad{background:#ff5d6c;color:#2a0409}
@media(max-width:760px){
  .topbar{display:flex;padding-top:calc(12px + env(safe-area-inset-top))}
  .sidebar{position:fixed;top:0;left:0;bottom:0;z-index:30;transform:translateX(-100%);transition:.22s;
    padding-top:calc(18px + env(safe-area-inset-top))}
  .sidebar.open{transform:none}
  .content{padding:18px 16px calc(70px + env(safe-area-inset-bottom));max-width:none}
  /* dim backdrop when the drawer is open */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:29;opacity:0;pointer-events:none;transition:.22s}
  .scrim.show{opacity:1;pointer-events:auto}
  /* comfortable tap targets */
  .navitem{padding:14px 12px;font-size:16px}
  .ghost{padding:9px 14px}
  h2{font-size:19px}
  .viewhead{align-items:center}
  .flashcard{height:230px;max-width:none}
  .fc-q{font-size:26px}
  .fc-a{font-size:23px}
  .artrow{width:100%}
  .artrow button{flex:1;min-width:0;padding:13px 0}
  .fcgrade{max-width:none}
  .fcgrade button{padding:15px 0}
  table.words td:first-child{width:42%}
  .card{padding:14px 15px}
}

</style>
<noscript><style>body{background:#0f1115;color:#e8ecf3;font-family:sans-serif;padding:40px}</style></noscript>
</head>

<script id="embed-ai" type="application/json">{"updated": "2026-08-15", "items": [{"title": "Anthropic, OpenAI, Google 的产品路线在 2026 年 8 月愈加分化", "url": "https://aiconference.london/how-anthropic-openai-and-google-compare-in-2026-august-2026-20260813-12", "summary": "2026 年 8 月，三家战略越走越不同：OpenAI 发布 GPT-5.5 Omni，走实时多模态 + 嵌入式助手路线；Google 把 Gemini 2.0 Pro 绑定到 Project Starline 的高保真远程通讯；Anthropic 主攻可信度与透明度，推出 Claude 3.1 系列，强调“推理透明”。说明 AI 行业不再是单一“模型比拼”，而是按场景走不同产品路线。\n\n对求职/学习的影响：若关注 AI 产品方向，需分清“多模态嵌入”（OpenAI）、“企业／高保真工具”（Google）、“安全／可解释性”（Anthropic）这三条路。", "date": "2026-08-15", "source": "AI World Congress 2026 roundup", "tag": "模型对比 · 产品路线"}, {"title": "Anthropic 向美国政府出售 Claude，仅收 1 美元", "url": "https://www.facebook.com/cnbc/videos/anthropic-is-giving-claude-to-the-us-government-for-1-as-ai-companies-try-to-win/1487096156060999/", "summary": "Anthropic 和 OpenAI 都宣布把自家 AI 产品卖给美国政府，价格仅为 1 美元。目的是抢占政府市场入口，让未来的持续合同更容易成交。\n\n对求职/学习的影响：AI 公司“低价进政府、长期赚政府”是游戏规则。了解这一模式有助于看懂大型 AI 合同与新闻里的“政府采购”buzz。", "date": "2026-08-15", "source": "CNBC", "tag": "政府采购 · 市场策略"}, {"title": "Google 公开 Gemini 2.0 Pro 与 Project Starline 的结合细节", "url": "https://ai.googleblog.com/", "summary": "Google 在 AI 官方博客更新了 Gemini 2.0 Pro 如何与 Project Starline（下一代全息通讯系统）结合的细节。Gemini 的一部分算力专门用于空间推理与逼真渲染，目标是让远程协作更接近面对面。\n\n对求职/学习的影响：端侧＋云侧的“多模态 + 实时渲染”正在成为高端 AI 产品的重要方向。若对 AR、远程会议、数字孪生感兴趣，这是离前线最近的信号。", "date": "2026-08-15", "source": "Google AI Blog", "tag": "多模态 · 远程通讯"}, {"title": "Anthropic 公开“Corrigible Scaling”：让人类监督不被智能体超越", "url": "https://www.nature.com/subjects/machine-learning", "summary": "Anthropic 在 8 月初发表了一篇关于“Corrigible Scaling”的论文，研究如何保证即使模型智能快速增长，人类的监督和纠错机制依然有效。这直接回应了“失去对超智能体控制”的担忧，也是 Anthropic 长期的安全叙事的一部分。\n\n对求职/学习的影响：AI 安全不再只是理念，出现了具体的技术路线（可纠错扩展）。若对 AI 对齐（alignment）、可解释性、安全评估感兴趣，这是近期最硬核的信号之一。", "date": "2026-08-15", "source": "Nature / Anthropic Research", "tag": "AI 安全 · 可解释性"}, {"title": "OpenAI Superalignment 进展：小模型监督大模型的突破", "url": "https://openai.com/research", "summary": "据传出的一份内部进展报告，OpenAI 的 Superalignment 团队在“用小模型解读并监督更大、更复杂模型的内部状态”方面取得了进展。这是实现可扩展监督（scalable oversight）的关键一步。\n\n对求职/学习的影响：监督机制本身也在用 AI 自动化——这是 AI 安全工程里很实际的方向：用更小模型来审查更大模型。", "date": "2026-08-15", "source": "OpenAI Research", "tag": "监督 · 对齐研究"}, {"title": "EU AI Act 首批数百万欧元罚款落地", "url": "https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai", "summary": "2026 年 7 月，欧盟人工智能法案（EU AI Act）已经开始执行，首批针对“高风险 AI 系统合规失败”的数百万欧元罚款已经落地。这迫使前沿模型实验室把合规工程当成核心运营成本，而不再只是一个理论任务。\n\n对求职/学习的影响：合规（compliance）、风险评估、文档与模型卡（model cards）都是实际岗位。若在欧洲找 AI 工作，这条法规直接影响企业需求。", "date": "2026-08-15", "source": "European Commission / EU AI Act", "tag": "监管 · 合规"}, {"title": "Google 发布 TPU v7：训练能效提升约 40%", "url": "https://www.technologyreview.com/topic/artificial-intelligence/", "summary": "Google 宣布其下一代张量处理器 TPU v7 正式可用，训练大模型时每瓦性能提升约 40%。Google 继续掌握自研芯片 + 软件栈的完整优势，能在芯片和模型设计上更紧密协同。\n\n对求职/学习的影响：硬件 + AI 的协同设计（co-design）是大型 AI 公司的核心竞争力。若对基础设施、芯片＋模型部署感兴趣，这是一个清晰信号。", "date": "2026-08-15", "source": "MIT Technology Review", "tag": "硬件 · 训练效率"}, {"title": "Anthropic 与 Oracle 达成新战略合作，扩大算力渠道", "url": "https://www.oracle.com/artificial-intelligence/", "summary": "Anthropic 在 2026 年 8 月宣布与 Oracle Cloud Infrastructure（OCI）建立新的战略合作关系，利用 OCI 的高性能裸金属集群运行部分可解释性研究工作负载。这是 Anthropic 继续走“多云 + 不依赖单一供应商”策略。\n\n对求职/学习的影响：大型 AI 公司的算力策略会影响招聘（云架构、异构集群、多云部署经验）。了解不同云厂商在 AI 基础设施上的角色，有助于看懂行业动态。", "date": "2026-08-15", "source": "Oracle / Anthropic", "tag": "算力 · 多云策略"}]}</script>
<script id="embed-de" type="application/json">{"updated": "2026-08-15", "level": "A2", "mix": "本地 · 耶拿 · 简易德语 · 全国", "items": [{"source": "Jenaer Nachrichten", "cat": "本地 · 耶拿", "url": "https://www.jenaer-nachrichten.de/stadtleben/29562-endlich-wieder-freie-fahrt-zwischen-jena-und-isserstedt", "date": "2026-08-15", "de": "Pendler können seit dem heutigen Mittwoch wieder ohne Umwege zwischen Jena und Isserstedt unterwegs sein. Die B7 ist nach fünfeinhalb Wochen Vollsperrung früher als geplant freigegeben worden.", "cn": "从本周三（今天）起，通勤者可以再次不绕路地往返于耶拿和伊瑟施泰特（Isserstedt）之间。B7 公路在全封闭五周半之后，比原计划提前恢复通行。", "words": [{"w": "Pendler", "m": "通勤者（der Pendler 阳性，复数 die Pendler）", "pl": "die Pendler"}, {"w": "seit dem heutigen Mittwoch", "m": "从本周三（今天）起（seit + 第三格；der Mittwoch 阳性；heutig 今天的）", "pl": "—", "note": "seit + Dativ für Zeitdauer (seit dem…)"}, {"w": "wieder", "m": "再次、又（时间副词）", "pl": "—"}, {"w": "ohne Umwege", "m": "不绕路（der Umweg 阳性，绕路，复数 die Umwege；ohne + 第四格）", "pl": "die Umwege", "note": "ohne + Akkusativ"}, {"w": "zwischen Jena und Isserstedt", "m": "在耶拿和伊瑟施泰特之间（zwischen + 第三格和第四格都可，此处表地点，介词后接第三格；Isserstedt 是专名，镇名）", "pl": "—"}, {"w": "unterwegs sein", "m": "在路上、在途中（固定短语；unterwegs 在途中）", "pl": "—"}, {"w": "Die B7", "m": "B7 公路（die Bundesstraße  federal highway；在德国用 B + 数字表示联邦公路）", "pl": "—"}, {"w": "nach fünfeinhalb Wochen", "m": "五周半之后（nach + 第三格；die Woche 阴性，复数 die Wochen；fünfeinhalb = fünf + einhalb）", "pl": "die Wochen", "note": "nach + Dativ für Zeit"}, {"w": "Vollsperrung", "m": "全封闭、全程封路（die Vollsperrung 阴性；voll 完全的 + Sperrung 封锁）", "pl": "die Vollsperrungen"}, {"w": "früher als geplant", "m": "比原计划提前（früher 更早的、提前；als 比；geplant 计划好的，形容词）", "pl": "—"}, {"w": "freigegeben worden", "m": "被解除（释放的被动表达；freigen(释放) + 词尾 -en 表被动完成，与 worden 搭配构成 Vorgangspassiv Vergangenheit）", "pl": "—", "note": "Vorgangspassiv: wurde freigegeben / ist freigegeben worden"}], "grammar": "Präsens + Vergangenheit kombiniert: 'sind ... freigegeben worden' ist Vorgangspassiv im Perfekt (sein + Partizip II + worden). 'seit + Dativ' drückt einen Zeitraum ab (seit dem heutigen Mittwoch = from this past Wednesday on). 'nach + Dativ' für Zeitangaben (nach fünfeinhalb Wochen). 'ohne + Akkusativ' (ohne Umwege). Wichtige lokale Infrastruktur-Nachrichten für Jena — Pendler-Bezug macht die Vokabeln praktisch."}, {"source": "MDR Nachrichten in Leichter Sprache", "cat": "简易德语", "url": "https://www.mdr.de/nachrichten-leicht/leichte-sprache-waldbrand-plauen-thueringen-vogtland-100.html", "date": "2026-08-15", "de": "Es ist schon ein großes Wald-Stück zerstört worden. Das Wald-Stück ist ungefähr so groß wie 10 Fußball-Felder.", "cn": "一个大面积的森林地块已经被毁坏。大约有 10 个足球场那么大。", "words": [{"w": "Es ist ... zerstört worden", "m": "已经被毁坏（es 虚主语/形式主语，白话语法里常用；zerstört 毁坏的，Partizip II；sein + Partizip II + worden 表示被动完成）", "pl": "—", "note": "Vorgangspassiv Perfekt: ist ... worden"}, {"w": "schon", "m": "已经（时间副词）", "pl": "—"}, {"w": "ein großes Wald-Stück", "m": "一个大的森林地块（das Wald-Stück 中性，Stück 小块，片段；groß 大的，形容词，中性单数结束：-es）", "pl": "die Wald-Stücke"}, {"w": "zerstört", "m": "毁坏的（Partizip II von zerstören 毁坏，动词）", "pl": "—"}, {"w": "ungefähr", "m": "大约、大体上（副词）", "pl": "—"}, {"w": "so groß wie", "m": "像……一样大（so ... wie 固定比较结构，表示“与……同样……”）", "pl": "—"}, {"w": "10 Fußball-Felder", "m": "10 个足球场（das Fußball-Feld 中性，复数 die Fußball-Felder；Fußball 足球，Feld 田野、场地）", "pl": "die Fußball-Felder"}], "grammar": "Leichte-Sprache-Stil: kurze Sätze, wenige Satzteile. 'Es ist ... worden' ist Vorgangspassiv im Perfekt — typisch für Nachrichten. 'so groß wie' ist eine einfache Vergleichs-struktur (so ... wie) ohne Konjugation des Adjektivs. 'ungefähr' = ungefähr（大约）是常见情况下副词。Klare A2-Struktur mit Passiv-Einstieg."}, {"source": "tagesschau", "cat": "全国新闻", "url": "https://www.tagesschau.de/inland/gesellschaft/waldbrand-nrw-eifel-102.html", "date": "2026-08-15", "de": "Seit Tagen brennt es im Hürtgenwald in der Eifel. Auch in der Nacht gingen die Löscharbeiten weiter. Die Feuerwehr musste ihre Einsatzzentrale verlegen - der Wind hatte sich gedreht.", "cn": "几天来，胡尔特根森林（Hürtgenwald）在埃菲尔（Eifel）地区一直在燃烧。夜里灭火工作也在继续。消防队不得不迁移他们的作战指挥中心——因为风向变了。", "words": [{"w": "Seit Tagen", "m": "好几天以来（der Tag 阳性，复数 die Tage；seit + 第三格表时间持续）", "pl": "die Tage", "note": "seit + Dativ für Dauer"}, {"w": "brennt es", "m": "它在燃烧（es 指 fires/火，中性代词在此为形式/环境主语；brennen 燃烧，动词）", "pl": "—"}, {"w": "im Hürtgenwald", "m": "在胡尔特根森林（der Hürtgenwald 阳性，德国西部的一个大森林名称，专有名词；in + 第三格表示地点 Static）", "pl": "—"}, {"w": "in der Eifel", "m": "在埃菲尔地区（die Eifel 阴性，德国西部山地地区名，专有名词；in + 第三格表地点，当“位于内部”时用第三格）", "pl": "—"}, {"w": "Auch in der Nacht", "m": "夜里也（die Nacht 阴性，名词，复数 die Nächte；in + 第三格指示时间点“在夜里”）", "pl": "die Nächte"}, {"w": "gingen ... weiter", "m": "继续进行（gehen 的过去时单数纯过去Gangen形式，继续往前推进；weiter 继续地、进一步）", "pl": "—"}, {"w": "die Löscharbeiten", "m": "灭火作业（die Löscharbeit 阴性，复数 die Löscharbeiten；löschen 扑灭，arbeit 工作，合成词）", "pl": "die Löscharbeiten"}, {"w": "Die Feuerwehr", "m": "消防队（die Feuerwehr 阴性，名词；Feuer 火，Wehrt/wehr 防御，合起来就是“灭火的防御队伍”）", "pl": "—"}, {"w": "musste ... verlegen", "m": "不得不迁移（müssen 的过去时单数形式 muss 的过去musste；verlegen 迁移、搬动，动词，Einsatzstützpunkt 等技术场所迁移）", "pl": "—"}, {"w": "ihre Einsatzzentrale", "m": "他们的作战指挥中心（die Zentrale 阴性，中心；Einsatz 派遣出动、作战行动；Zentrale 中心，合成词）", "pl": "die Einsatzzentralen"}, {"w": "der Wind hatte sich gedreht", "m": "风已经转向了（der Wind 阳性，复数 die Winde；sich drehen 旋转、转向，反身动词；Plusquamperfekt 过去完成时：hatte gedreht）", "pl": "die Winde", "note": "Plusquamperfekt (hatte sich gedreht) 表示“发生在另一个过去动作之前”"}], "grammar": "Zeitliche Abfolge mit Past-Tense-Mix: Präsens (brennt), Präteritum (gingen, musste), Plusquamperfekt (hatte sich gedreht). 'seit + Dativ' und 'in + Dativ' für Zeit/Lokal. 'weitergehen' als Trennbare-Verben-Erweiterung (gingen weiter) — die Doppelung des Ort-Zeit-Gefühls. 'musste verlegen' zeigt Modal-Präteritum + Infinitiv (müssen in der Vergangenheit). Landschaft + Waldbrand-Nachricht gibt lokale/geografische A2-Einordnung (Eifel, Hürtgenwald)."}]}</script>

ews", "lvl": "A2"}, {"de": "Heizung", "art": "die", "pl": "Heizungen", "en": "heating", "cn": "供暖、暖气", "src": "news", "lvl": "A2"}, {"de": "Wohnung", "art": "die", "pl": "Wohnungen", "en": "apartment", "cn": "公寓、住房", "src": "news", "lvl": "A2"}, {"de": "Mieter", "art": "der", "pl": "Mieter", "en": "tenant", "cn": "租客、房客", "src": "news", "lvl": "A2"}, {"de": "Hausbesitzer", "art": "der", "pl": "Hausbesitzer", "en": "homeowner", "cn": "房主、屋主", "src": "news", "lvl": "A2"}]}</script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// app booted, so CSS/JS loaded fine — drop the "missing files" notice
$('loaderr')?.remove();

// ---------- 离线 App 模式 ----------
// 单文件版 (workbench.html) 内嵌 <meta name="x-standalone" content="1">。
// 此模式下: 不依赖服务器。数据优先级 = localStorage 缓存(离线也能看最新) > 内嵌快照。
// 连网时点"检查更新"从固定地址拉最新单文件, 抽数据缓存并就地渲染。
const STANDALONE = !!document.querySelector('meta[name="x-standalone"]');
const CACHE_KEY = 'workbench_data_v1';
function cacheSave(ai, de, vocab) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ai, de, vocab, ts: Date.now() })); } catch {}
}
function cacheLoad() {
  try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch { return null; }
}

// ---------- nav ----------
const sidebar = $('sidebar');
const scrim = $('scrim');
const setDrawer = open => {
  sidebar.classList.toggle('open', open);
  scrim.classList.toggle('show', open);
};
$('menuBtn').onclick = () => setDrawer(!sidebar.classList.contains('open'));
scrim.onclick = () => setDrawer(false);

function showView(view) {
  const btn = document.querySelector(`.navitem[data-view="${view}"]`);
  if (!btn) return false;
  document.querySelectorAll('.navitem').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
  btn.classList.add('active');
  $('view-' + view).classList.add('active');
  $('title').textContent = btn.textContent.trim();
  setDrawer(false);
  return true;
}
document.querySelectorAll('.navitem').forEach(b => b.onclick = () => {
  showView(b.dataset.view);
  history.replaceState(null, '', '#' + b.dataset.view);
});
showView((location.hash || '').slice(1)) || showView('ai');
addEventListener('hashchange', () => showView((location.hash || '').slice(1)));

// embedded fallback so file:// works without a server
function embedded(id) {
  const el = $(id);
  try { return el ? JSON.parse(el.textContent) : null; } catch { return null; }
}
// 数据来源: standalone -> 缓存优先, 否则内嵌; server -> 先 fetch 再内嵌
async function load(url, embedId) {
  if (STANDALONE) {
    const key = embedId.replace('embed-', '');
    const c = cacheLoad();
    if (c && c[key]) return c[key];
    return embedded(embedId);
  }
  try {
    const r = await fetch(url + '?t=' + Date.now());
    if (!r.ok) throw 0;
    return await r.json();
  } catch {
    return embedded(embedId);
  }
}

// 检查更新 (standalone): 拉固定地址最新单文件, 抽数据缓存并渲染
async function checkUpdate() {
  if (!STANDALONE) return;
  const btn = $('update-btn');
  if (btn) { btn.disabled = true; btn.textContent = '↻ 更新中…'; }
  try {
    const html = await (await fetch('https://workbench.serveousercontent.com/workbench.html', { cache: 'no-store' })).text();
    const grab = id => {
      const m = html.match(new RegExp('<script id="' + id + '"[^>]*>([\\s\\S]*?)<\/script>'));
      if (!m) return null;
      try { return JSON.parse(m[1].replace(/<\\//g, '</')); } catch { return null; }
    };
    const ai = grab('embed-ai'), de = grab('embed-de'), vocab = grab('embed-vocab');
    if (ai && de && vocab) {
      cacheSave(ai, de, vocab);
      renderAI(ai); renderDE(de);
      FC.all = (vocab.cards) || []; buildDeck();
      if (btn) { btn.textContent = '✓ 已是最新'; setTimeout(() => { btn.textContent = '检查更新'; btn.disabled = false; }, 1500); }
    } else if (btn) { btn.textContent = '检查更新'; btn.disabled = false; }
  } catch {
    if (btn) { btn.textContent = '检查更新'; btn.disabled = false; }
  }
}

// safe storage: on file:// (AirDrop / phone) localStorage throws SecurityError,
// so fall back to an in-memory object that never crashes the page
const store = (() => {
  try { localStorage.getItem('__t'); return localStorage; }
  catch { const m = {}; return { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); } }; }
})();

// ---------- AI ----------
function renderAI(d) {
  const el = $('ai-list');
  if (!d || !d.items || !d.items.length) { el.innerHTML = '<div class="empty">暂无数据</div>'; return; }
  $('ai-date').textContent = '更新于 ' + (d.updated || '—');
  el.innerHTML = d.items.map(i => `<div class="card">
      <h3>${esc(i.title)}</h3>
      <div class="src">${esc(i.source || '')}${i.date ? ' · ' + esc(i.date) : ''}</div>
      <div>${esc(i.summary || '')}</div>
      ${i.url ? `<div style="margin-top:10px"><a href="${esc(i.url)}" target="_blank" rel="noopener">阅读原文 →</a></div>` : ''}
    </div>`).join('');
}

// ---------- German ----------
function renderDE(d) {
  const el = $('de-list');
  if (!d || !d.items || !d.items.length) { el.innerHTML = '<div class="empty">暂无数据</div>'; return; }
  $('de-date').textContent = '更新于 ' + (d.updated || '—');
  el.innerHTML = d.items.map((i, n) => `<div class="card">
      <div class="src">第 ${n + 1} 条 ${i.cat ? `<span class="tag">${esc(i.cat)}</span>` : ''}
        ${i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.source || '')}</a>` : esc(i.source || '')}${i.date ? ' · ' + esc(i.date) : ''}</div>
      <p class="de-sent">${esc(i.de)}</p>
      <p class="de-cn">${esc(i.cn)}</p>
      <table class="words">${(i.words || []).map(w =>
    `<tr><td>${esc(w.w)}</td><td>${esc(w.m)}</td></tr>`).join('')}</table>
      ${i.grammar ? `<div class="gram"><b>语法 / Grammar:</b> ${esc(i.grammar)}</div>` : ''}
    </div>`).join('');
}

// 刷新按钮: standalone 模式 -> 检查更新; 服务器模式 -> 触发 /refresh 或 reload
const FEEDS = [
  { btn: 'ai-refresh', url: 'data/ai.json', embed: 'embed-ai', render: renderAI, live: true },
  { btn: 'de-refresh', url: 'data/german.json', embed: 'embed-de', render: renderDE, live: false }
];
FEEDS.forEach(({ btn, url, embed, render, live }) => {
  load(url, embed).then(render);
  const b = $(btn);
  b.onclick = async () => {
    if (STANDALONE) { checkUpdate(); return; }
    const label = b.textContent;
    b.disabled = true; b.textContent = '↻ 抓取中…';
    if (live && location.protocol !== 'file:') {
      try {
        const r = await fetch('/refresh', { cache: 'no-store' });
        const j = await r.json().catch(() => null);
        if (j && j.status === 'started') {
          b.textContent = '↻ 已触发，刷新中…';
          setTimeout(() => location.reload(), 4000);
          return;
        }
      } catch { /* 服务不可用就退回本地重载 */ }
    }
    location.reload();
  };
});

// ---------- streak ----------
const todayKey = () => new Date().toISOString().slice(0, 10);
function renderStreak() {
  const s = JSON.parse(store.getItem('de_streak') || '{"last":"","n":0}');
  $('de-streak').textContent =
    `连续 ${s.n} 天` + (s.last === todayKey() ? ' ✓ 今天已打卡' : '');
}
$('de-done').onclick = () => {
  const s = JSON.parse(store.getItem('de_streak') || '{"last":"","n":0}');
  const t = todayKey();
  if (s.last === t) return;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  s.n = (s.last === y) ? s.n + 1 : 1;
  s.last = t;
  store.setItem('de_streak', JSON.stringify(s));
  renderStreak();
};
renderStreak();

// service worker 只在服务器模式注册 (standalone 离线版不需要)
if (!STANDALONE && 'serviceWorker' in navigator && location.protocol !== 'file:')
  navigator.serviceWorker.register('sw.js').catch(() => {});

// ---------- Flashcards ----------
const FC = {
  deck: [], i: 0, ok: 0, no: 0, flipped: false, dirOf: 'de2en', card: null, artAnswered: null
};

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

load('data/vocab.json', 'embed-vocab').then(d => {
  FC.all = (d && d.cards) || [];
  buildDeck();
});

function buildDeck() {
  const scope = $('fc-src').value;
  let pool = FC.all.filter(c => {
    if (scope === 'all') return true;
    if (scope === 'noun') return !!c.art;
    if (scope === 'news') return c.src === 'news';
    if (scope === 'A2') return c.lvl === 'A2';
    return true;
  });
  FC.deck = shuffle(pool.slice());
  FC.i = 0; FC.ok = 0; FC.no = 0;
  $('fc-done').hidden = true;
  $('fc-card').style.display = '';
  showCard();
  updateStats();
}

function updateStats() {
  $('fc-ok').textContent = FC.ok;
  $('fc-no').textContent = FC.no;
  $('fc-left').textContent = Math.max(0, FC.deck.length - FC.i);
}

function showCard() {
  const c = FC.deck[FC.i];
  FC.card = c;
  FC.flipped = false;
  FC.artAnswered = null;
  $('fc-card').classList.remove('flip');
  $('fc-grade').hidden = true;
  $('fc-tap').hidden = false;

  if (!c) {
    $('fc-card').style.display = 'none';
    $('fc-grade').hidden = true;
    $('fc-done').hidden = false;
    return;
  }

  const mode = $('fc-dir').value;
  const dir = mode === 'mix' ? (Math.random() < 0.5 ? 'de2en' : 'en2de') : mode;
  FC.dirOf = dir;

  const artBox = $('fc-art');
  [...artBox.querySelectorAll('button')].forEach(b => {
    b.className = ''; b.disabled = false;
  });

  if (dir === 'de2en') {
    $('fc-q').textContent = c.de;
    $('fc-hint').textContent = c.art ? '名词 · 先选冠词，再翻面看意思' : '想一想英文意思';
    artBox.hidden = !c.art;
  } else {
    $('fc-q').textContent = c.en;
    $('fc-hint').textContent = c.art ? '名词 · 先选冠词，再翻面看德语' : '想一想德语怎么说';
    artBox.hidden = !c.art;
  }
}

function backText() {
  const c = FC.card;
  if (!c) return;
  const full = c.art ? `${c.art} ${c.de}` : c.de;
  $('fc-a').textContent = FC.dirOf === 'de2en' ? c.en : full;
  const bits = [];
  if (FC.dirOf === 'de2en' && c.art) bits.push(`正确冠词：<b>${c.art} ${c.de}</b>`);
  if (FC.dirOf === 'en2de') bits.push(`英文：${c.en}`);
  bits.push(`中文：${c.cn}`);
  if (c.pl && c.pl !== '—') bits.push(`复数：die ${c.pl}`);
  if (c.note) bits.push(`提示：${c.note}`);
  $('fc-extra').innerHTML = bits.join('<br>');
}

function flip() {
  if (!FC.card || FC.flipped) return;
  FC.flipped = true;
  backText();
  $('fc-card').classList.add('flip');
  $('fc-grade').hidden = false;
  $('fc-tap').hidden = true;
}

$('fc-card').addEventListener('click', e => {
  if (e.target.closest('.artrow')) return;
  flip();
});

$('fc-art').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn || !FC.card || FC.artAnswered) return;
  FC.artAnswered = btn.dataset.art;
  const right = FC.card.art;
  [...$('fc-art').querySelectorAll('button')].forEach(b => {
    if (b.dataset.art === right) b.className = 'right';
    else if (b === btn) b.className = 'wrong';
    b.disabled = true;
  });
  if (FC.artAnswered !== right) FC.no++;
  updateStats();
});

$('fc-grade').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const artWrong = FC.card && FC.card.art && FC.artAnswered && FC.artAnswered !== FC.card.art;
  const known = btn.dataset.g === '1' && !artWrong;

  if (known) {
    FC.ok++;
  } else {
    if (!artWrong) FC.no++;
    const gap = Math.min(4 + Math.floor(Math.random() * 3), FC.deck.length - FC.i);
    FC.deck.splice(FC.i + gap, 0, FC.card);
  }
  FC.i++;
  showCard();
  updateStats();
});

$('fc-reset').onclick = buildDeck;
$('fc-dir').onchange = buildDeck;
$('fc-src').onchange = buildDeck;

// keyboard: space = flip, 1 = 不会, 2 = 会了
addEventListener('keydown', e => {
  if (!$('view-fc').classList.contains('active')) return;
  if (e.code === 'Space') { e.preventDefault(); flip(); }
  if (FC.flipped && (e.key === '1' || e.key === '2')) {
    $('fc-grade').querySelector(e.key === '2' ? '.good' : '.bad').click();
  }
});

</script>
</body>
</html>
