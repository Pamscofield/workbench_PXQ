<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<title>Workbench</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<!-- iOS: add-to-home-screen behaves like an app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workbench">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<link rel="stylesheet" href="style.css">
<noscript><style>body{background:#0f1115;color:#e8ecf3;font-family:sans-serif;padding:40px}</style></noscript>
</head>
<body>
<!-- If style.css/app.js are missing (this file copied out on its own), show why
     instead of a blank page. JS removes it as soon as the app boots. -->
<div id="loaderr" style="position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;
  z-index:99999;background:#0f1115;color:#e8ecf3;overflow:auto;
  font:15px/1.7 -apple-system,'PingFang SC',sans-serif;padding:34px 24px;margin:0">
  <div style="max-width:460px;margin:8vh auto">
    <div style="font-size:38px;margin-bottom:14px">📄</div>
    <h2 style="margin:0 0 12px;font-size:19px">这个文件不能单独打开</h2>
    <p style="color:#8b94a6;margin:0 0 18px">
      <code>index.html</code> 需要同目录下的 <code>style.css</code>、<code>app.js</code> 和
      <code>data/</code> 文件夹，单独复制出来就会白屏。
    </p>
    <p style="margin:0 0 8px"><b>要发到手机 / 单独打开，请用：</b></p>
    <p style="background:#1d222b;border:1px solid #262c37;border-radius:10px;padding:12px 14px;margin:0">
      <b style="color:#5b9cff">workbench.html</b><br>
      <span style="color:#8b94a6;font-size:13px">同一个文件夹里，所有内容都打包在一个文件内，可直接 AirDrop / 微信发到手机。</span>
    </p>
  </div>
</div>
<header class="topbar">
  <button id="menuBtn" class="iconbtn" aria-label="menu">☰</button>
  <h1 id="title">工作台</h1>
  <button id="update-btn" class="ghost" hidden>检查更新</button>
</header>

<div class="layout">
  <div id="scrim" class="scrim"></div>
  <nav id="sidebar" class="sidebar">
    <div class="brand">Workbench</div>
    <button class="navitem active" data-view="ai"><span>🤖</span> AI 情报</button>
    <button class="navitem" data-view="de"><span>🇩🇪</span> 德语打卡</button>
    <button class="navitem" data-view="fc"><span>🃏</span> 单词翻页</button>
    <div class="spacer"></div>
    <div class="hint">数据由 Hermes 定时更新<br>可离线查看</div>
  </nav>

  <main class="content">
    <section id="view-ai" class="view active">
      <div class="viewhead">
        <h2>AI 情报</h2>
        <span class="headright">
          <span id="ai-date" class="muted"></span>
          <button id="ai-refresh" class="ghost">↻ 刷新</button>
        </span>
      </div>
      <div id="ai-list" class="cards"><div class="empty">加载中…</div></div>
    </section>

    <section id="view-de" class="view">
      <div class="viewhead">
        <h2>德语打卡 · A2</h2>
        <span class="headright">
          <span id="de-date" class="muted"></span>
          <span id="de-streak" class="pill">连续 0 天</span>
          <button id="de-refresh" class="ghost">↻ 刷新</button>
        </span>
      </div>
      <div id="de-list" class="cards"><div class="empty">加载中…</div></div>
      <button id="de-done" class="primary">✅ 今天完成打卡</button>
    </section>

    <section id="view-fc" class="view">
      <div class="viewhead">
        <h2>单词翻页</h2>
        <span class="muted">✔ <b id="fc-ok">0</b> · ✘ <b id="fc-no">0</b> · 剩 <b id="fc-left">0</b></span>
      </div>

      <div class="fcbar">
        <label>方向
          <select id="fc-dir">
            <option value="de2en">德 → 英</option>
            <option value="en2de">英 → 德</option>
            <option value="mix">混合</option>
          </select>
        </label>
        <label>范围
          <select id="fc-src">
            <option value="all">全部</option>
            <option value="news">打卡生词</option>
            <option value="A2">A2 常用</option>
            <option value="noun">只练名词冠词</option>
          </select>
        </label>
        <button id="fc-reset" class="ghost">重新开始</button>
      </div>

      <div id="fc-card" class="flashcard">
        <div class="fc-inner">
          <div class="fc-face fc-front">
            <div class="fc-q" id="fc-q">—</div>
            <div class="fc-hint" id="fc-hint"></div>
            <div id="fc-art" class="artrow" hidden>
              <button data-art="der">der</button>
              <button data-art="die">die</button>
              <button data-art="das">das</button>
            </div>
            <div class="fc-tap" id="fc-tap">点击卡片翻面</div>
          </div>
          <div class="fc-face fc-back">
            <div class="fc-a" id="fc-a">—</div>
            <div class="fc-extra" id="fc-extra"></div>
          </div>
        </div>
      </div>

      <div class="fcgrade" id="fc-grade" hidden>
        <button class="bad" data-g="0">✘ 不会</button>
        <button class="good" data-g="1">✔ 会了</button>
      </div>
      <p class="muted" id="fc-done" hidden>🎉 这一轮练完了，点「重新开始」再来一轮。</p>
    </section>
  </main>
</div>

<script id="embed-de" type="application/json">{"updated": "2026-08-20", "level": "A2", "mix": "Jena lokal · Einfache Deutsch · National", "items": [{"source": "Jenaer Nachrichten", "cat": "Jena lokal", "url": "https://www.jenaer-nachrichten.de/stadtleben/29591-kommunalservice-jena-begruesst-sieben-neue-auszubildende", "date": "2026-08-20", "de": "Der Kommunalservice Jena begrüßt sieben neue Auszubildende. Die jungen Leute beginnen im August ihre Ausbildung. Sie lernen Berufe wie Gärtner oder Mechaniker.", "cn": "耶拿市政服务公司迎来了七名新学徒。这些年轻人八月开始他们的职业培训。他们学习园丁或技工等职业。", "words": [{"w": "Der Kommunalservice", "m": "市政服务公司（der Service 男性，服务；此处指耶拿的城市服务/市政公司）", "pl": "die Services"}, {"w": "begrüßt", "m": "欢迎（begrüßen 欢迎，规则动词，第三人称单数 begrüßt）", "pl": "—"}, {"w": "sieben neue Auszubildende", "m": "七名新学徒（der Auszubildende 男性，学徒/培训生；sieben 七；neue 新的，第四格复数加 -e）", "pl": "die Auszubildenden", "note": "weak noun: masc. pl. takes -en in Accusative"}, {"w": "Die jungen Leute", "m": "这些年轻人（jung 年轻的；die Leute 人们/年轻人，复数，无单数冠词变化）", "pl": "—"}, {"w": "beginnen", "m": "开始（动词，不规则：er/sie/es beginnt；此处复数 beginnen）", "pl": "—"}, {"w": "im August", "m": "在八月（der August 男性，八月；im = in dem，in + 第三格表时间'在…月里'）", "pl": "—", "note": "in + Dativ = month (when)"}, {"w": "ihre Ausbildung", "m": "他们的职业培训（die Ausbildung 女性，职业培训/培训；ihre 他们的，第四格）", "pl": "die Ausbildungen"}, {"w": "Sie lernen", "m": "他们学习（lernen 学习，规则动词，复数 lernen）", "pl": "—"}, {"w": "Berufe", "m": "职业（der Beruf 男性，职业，复数 die Berufe）", "pl": "die Berufe"}, {"w": "wie Gärtner oder Mechaniker", "m": "比如园丁或技工（wie 比如/像；der Gärtner 男性，园丁；oder 或者；der Mechaniker 男性，技工/机械师）", "pl": "die Gärtner / die Mechaniker"}], "grammar": "'begrüßt' is the 3rd-person singular present of the regular verb 'begrüßen'. 'im August' = 'in dem August' uses 'in' + Dative for a month (when). 'sieben neue Auszubildende' is Accusative (direct object of begrüßen) — note the weak-noun ending '-en' on the masculine plural after 'neue'. 'ihre Ausbildung' is Accusative (object of beginnen). The plural verbs 'beginnen' and 'lernen' agree with their plural subjects."}, {"source": "nachrichtenleicht (DLF)", "cat": "Einfache Deutsch", "url": "https://www.nachrichtenleicht.de/hitzeschutz-grundgesetz-100.html", "date": "2026-08-20", "de": "SPD-Minister sagen: Der Hitze-Schutz muss im Grundgesetz stehen. Die Minister wollen den Schutz vor großer Hitze im Gesetz festhalten. Viele Menschen leiden im Sommer unter der Hitze.", "cn": "社民党的部长们说：防暑保护必须写进基本法。部长们想把防酷热的保护写进法律。许多人在夏天受高温之苦。", "words": [{"w": "SPD-Minister", "m": "社民党部长（die SPD 女性，社民党/德国社会民主党；der Minister 男性，部长，复数 die Minister）", "pl": "die Minister"}, {"w": "sagen", "m": "说（sagen 说，规则动词，复数 sagen）", "pl": "—"}, {"w": "Der Hitze-Schutz", "m": "防暑保护/防热措施（der Schutz 男性，保护；Hitze 炎热）", "pl": "die Schutz-", "note": "compound noun: Hitze + Schutz"}, {"w": "muss", "m": "必须（müssen 情态动词，第三人称单数 muss；后接不定式 stehen 放句末）", "pl": "—", "note": "modal verb + infinitive at clause end"}, {"w": "im Grundgesetz", "m": "在基本法里（das Grundgesetz 中性，基本法/德国宪法；im = in dem，in + 第三格表地点'在…里'）", "pl": "die Grundgesetze", "note": "in + Dativ = location (where)"}, {"w": "stehen", "m": "站立/位于/写明（stehen 站/处在，此处指'载入/写进'；与 muss 连用放句末）", "pl": "—"}, {"w": "Die Minister", "m": "部长们（der Minister 男性，复数 die Minister）", "pl": "die Minister"}, {"w": "wollen", "m": "想要（wollen 情态动词，复数 wollen；后接不定式 festhalten 放句末）", "pl": "—", "note": "modal verb + infinitive at clause end"}, {"w": "den Schutz vor großer Hitze", "m": "对酷热的保护（der Schutz 男性，第四格；vor + 第三格表'防/在…之前'；groß 大的，第三格 großer；die Hitze 女性，炎热）", "pl": "—", "note": "vor + Dativ = protection from"}, {"w": "im Gesetz festhalten", "m": "写进法律/固定下来（das Gesetz 中性，法律；festhalten 抓住/固定，可分动词）", "pl": "die Gesetze"}, {"w": "Viele Menschen", "m": "许多人（der Mensch 男性，人，复数 die Menschen；viele 许多）", "pl": "die Menschen"}, {"w": "leiden", "m": "受苦/遭受（leiden 忍受/受…苦，动词）", "pl": "—"}, {"w": "unter der Hitze", "m": "在高温之下（unter + 第三格表'在…之下'；die Hitze 女性）", "pl": "—", "note": "unter + Dativ = under"}], "grammar": "'muss' and 'wollen' are modal verbs — their infinitives ('stehen', 'festhalten') move to the end of the clause. 'im Grundgesetz' = 'in dem Grundgesetz' uses 'in' + Dative for location (where). 'vor großer Hitze' uses 'vor' + Dative ('protection from'). 'unter der Hitze' uses 'unter' + Dative ('under the heat'). Plural subjects ('SPD-Minister', 'Die Minister', 'Viele Menschen') take plural verbs ('sagen', 'wollen', 'leiden')."}, {"source": "tagesschau", "cat": "National", "url": "https://www.tagesschau.de/ausland/amerika/medizin-hautkrebs-studi-impfstoff-100.html", "date": "2026-08-20", "de": "Eine Studie war erfolgreich. Sie gibt Hoffnung auf einen Impfstoff gegen schwarzen Hautkrebs. Der Impfstoff soll Menschen vor der Krankheit schützen.", "cn": "一项研究取得了成功。它带来了对一种抗黑色素瘤（黑色皮肤癌）疫苗的希望。这种疫苗应当保护人们免受这种疾病侵害。", "words": [{"w": "Eine Studie", "m": "一项研究（die Studie 女性，研究/调查；eine 不定冠词 阴性）", "pl": "die Studien"}, {"w": "war erfolgreich", "m": "是成功的/取得了成功（sein 的过去时 war；erfolgreich 成功的，形容词）", "pl": "—", "note": "war = Präteritum of sein"}, {"w": "Sie gibt Hoffnung", "m": "它带来希望（geben 给/带来，第三人称单数 gibt；die Hoffnung 女性，希望）", "pl": "die Hoffnungen"}, {"w": "auf einen Impfstoff", "m": "对一种疫苗（der Impfstoff 男性，疫苗；auf + 第四格表'朝向/对'；einen 不定冠词第四格）", "pl": "die Impfstoffe", "note": "auf + Akkusativ = toward"}, {"w": "gegen schwarzen Hautkrebs", "m": "对抗黑色皮肤癌（gegen + 第四格表'对抗'；schwarz 黑色的，第四格 schwarzen；der Hautkrebs 男性，皮肤癌）", "pl": "die Hautkrebse", "note": "gegen + Akkusativ = against"}, {"w": "Der Impfstoff", "m": "这种疫苗（der Impfstoff 男性）", "pl": "die Impfstoffe"}, {"w": "soll", "m": "应当/应该（sollen 情态动词，第三人称单数 soll；后接不定式 schützen 放句末）", "pl": "—", "note": "modal verb + infinitive at clause end"}, {"w": "Menschen", "m": "人们（der Mensch 男性，复数 die Menschen）", "pl": "die Menschen"}, {"w": "vor der Krankheit", "m": "免受这种疾病（vor + 第三格表'在…之前/防'；die Krankheit 女性，疾病）", "pl": "die Krankheiten", "note": "vor + Dativ = protection from"}, {"w": "schützen", "m": "保护（schützen 保护，动词，与 soll 连用放句末）", "pl": "—"}],
