<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<title>Workbench</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<!-- iOS: add-to-home-screen behaves like an app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workbench">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<link rel="stylesheet" href="style.css">
<noscript><style>body{background:#0f1115;color:#e8ecf3;font-family:sans-serif;padding:40px}</style></noscript>
</head>
<body>
<!-- If style.css/app.js are missing (this file copied out on its own), show why
     instead of a blank page. JS removes it as soon as the app boots. -->
<div id="loaderr" style="position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;
  z-index:99999;background:#0f1115;color:#e8ecf3;overflow:auto;
  font:15px/1.7 -apple-system,'PingFang SC',sans-serif;padding:34px 24px;margin:0">
  <div style="max-width:460px;margin:8vh auto">
    <div style="font-size:38px;margin-bottom:14px">📄</div>
    <h2 style="margin:0 0 12px;font-size:19px">这个文件不能单独打开</h2>
    <p style="color:#8b94a6;margin:0 0 18px">
      <code>index.html</code> 需要同目录下的 <code>style.css</code>、<code>app.js</code> 和
      <code>data/</code> 文件夹，单独复制出来就会白屏。
    </p>
    <p style="margin:0 0 8px"><b>要发到手机 / 单独打开，请用：</b></p>
    <p style="background:#1d222b;border:1px solid #262c37;border-radius:10px;padding:12px 14px;margin:0">
      <b style="color:#5b9cff">workbench.html</b><br>
      <span style="color:#8b94a6;font-size:13px">同一个文件夹里，所有内容都打包在一个文件内，可直接 AirDrop / 微信发到手机。</span>
    </p>
  </div>
</div>
<header class="topbar">
  <button id="menuBtn" class="iconbtn" aria-label="menu">☰</button>
  <h1 id="title">工作台</h1>
  <button id="update-btn" class="ghost" hidden>检查更新</button>
</header>

<div class="layout">
  <div id="scrim" class="scrim"></div>
  <nav id="sidebar" class="sidebar">
    <div class="brand">Workbench</div>
    <button class="navitem active" data-view="ai"><span>🤖</span> AI 情报</button>
    <button class="navitem" data-view="de"><span>🇩🇪</span> 德语打卡</button>
    <button class="navitem" data-view="fc"><span>🃏</span> 单词翻页</button>
    <div class="spacer"></div>
    <div class="hint">数据由 Hermes 定时更新<br>可离线查看</div>
  </nav>

  <main class="content">
    <section id="view-ai" class="view active">
      <div class="viewhead">
        <h2>AI 情报</h2>
        <span class="headright">
          <span id="ai-date" class="muted"></span>
          <button id="ai-refresh" class="ghost">↻ 刷新</button>
        </span>
      </div>
      <div id="ai-list" class="cards"><div class="empty">加载中…</div></div>
    </section>

    <section id="view-de" class="view">
      <div class="viewhead">
        <h2>德语打卡 · A2</h2>
        <span class="headright">
          <span id="de-date" class="muted"></span>
          <span id="de-streak" class="pill">连续 0 天</span>
          <button id="de-refresh" class="ghost">↻ 刷新</button>
        </span>
      </div>
      <div id="de-list" class="cards"><div class="empty">加载中…</div></div>
      <button id="de-done" class="primary">✅ 今天完成打卡</button>
    </section>

    <section id="view-fc" class="view">
      <div class="viewhead">
        <h2>单词翻页</h2>
        <span class="muted">✔ <b id="fc-ok">0</b> · ✘ <b id="fc-no">0</b> · 剩 <b id="fc-left">0</b></span>
      </div>

      <div class="fcbar">
        <label>方向
          <select id="fc-dir">
            <option value="de2en">德 → 英</option>
            <option value="en2de">英 → 德</option>
            <option value="mix">混合</option>
          </select>
        </label>
        <label>范围
          <select id="fc-src">
            <option value="all">全部</option>
            <option value="news">打卡生词</option>
            <option value="A2">A2 常用</option>
            <option value="noun">只练名词冠词</option>
          </select>
        </label>
        <button id="fc-reset" class="ghost">重新开始</button>
      </div>

      <div id="fc-card" class="flashcard">
        <div class="fc-inner">
          <div class="fc-face fc-front">
            <div class="fc-q" id="fc-q">—</div>
            <div class="fc-hint" id="fc-hint"></div>
            <div id="fc-art" class="artrow" hidden>
              <button data-art="der">der</button>
              <button data-art="die">die</button>
              <button data-art="das">das</button>
            </div>
            <div class="fc-tap" id="fc-tap">点击卡片翻面</div>
          </div>
          <div class="fc-face fc-back">
            <div class="fc-a" id="fc-a">—</div>
            <div class="fc-extra" id="fc-extra"></div>
          </div>
        </div>
      </div>

      <div class="fcgrade" id="fc-grade" hidden>
        <button class="bad" data-g="0">✘ 不会</button>
        <button class="good" data-g="1">✔ 会了</button>
      </div>
      <p class="muted" id="fc-done" hidden>🎉 这一轮练完了，点「重新开始」再来一轮。</p>
    </section>
  </main>
</div>

<script id="embed-de" type="application/json">{"updated": "2026-08-21", "level": "A2", "mix": "Jena lokal · Einfache Deutsch · National", "items": [{"source": "Jenaer Nachrichten", "cat": "Jena lokal", "url": "https://www.jenaer-nachrichten.de/stadtleben/29601-125-jahre-strom-extra-foerdertopf-staerkt-projekte-auf-jena-crowd", "date": "2026-08-21", "de": "Die Stadtwerke Jena feiern 125 Jahre Strom. Für das Jubiläum gibt es einen extra Fördertopf. Der Fördertopf stärkt neue Projekte auf der Plattform 'Jena Crowd'. Bürger können dort ihre Ideen zeigen.", "cn": "耶拿市能源公司庆祝供电 125 周年。为纪念这个周年，设立了一个额外的资助基金。这笔资助基金支持'耶拿众筹'(Jena Crowd)平台上的新项目。市民可以在那里展示自己的想法。", "words": [{"w": "Die Stadtwerke", "m": "市营公用事业公司/市能源公司（die Stadtwerke 女性复数，由 Stadt 城市 + Werke 工程/工厂 组成；此处指耶拿市电力公司）", "pl": "die Stadtwerke"}, {"w": "feiern", "m": "庆祝（规则动词，复数 feiern，此处 Die Stadtwerke Jena 作复数主语）", "pl": "—"}, {"w": "125 Jahre Strom", "m": "供电 125 年（das Jahr 中性，年，复数 die Jahre；der Strom 男性，电/电流）", "pl": "die Jahre"}, {"w": "Das Jubiläum", "m": "周年纪念/纪念日（das Jubiläum 中性，125 年即周年）", "pl": "die Jubiläen"}, {"w": "gibt es", "m": "有（固定句型 es gibt '有'，此处 gibt 第三人称单数 + es；einen extra Fördertopf 为第四格宾语）", "pl": "—"}, {"w": "einen extra Fördertopf", "m": "一个额外的资助基金/扶持资金池（der Fördertopf 男性，资助金池；extra 额外的，第四格 einen）", "pl": "die Fördertöpfe"}, {"w": "stärkt", "m": "加强/支持（stärken 加强，规则动词，第三人称单数 stärkt）", "pl": "—"}, {"w": "neue Projekte", "m": "新项目（das Projekt 中性，项目，复数 die Projekte；neu 新的，第四格加 -e）", "pl": "die Projekte"}, {"w": "auf der Plattform", "m": "在平台上（die Plattform 女性，平台；auf + 第三格表地点'在…上'）", "pl": "die Plattformen", "note": "auf + Dativ = location (where)"}, {"w": "Jena Crowd", "m": "耶拿众筹（本地众筹平台专有名称，市民可在此展示项目并募资）", "pl": "—"}, {"w": "Bürger", "m": "市民/公民（der Bürger 男性，市民，复数 die Bürger）", "pl": "die Bürger"}, {"w": "können", "m": "能/可以（können 情态动词，复数 können；后接不定式 zeigen 放句末）", "pl": "—", "note": "modal verb + infinitive at clause end"}, {"w": "ihre Ideen zeigen", "m": "展示他们的想法（die Idee 女性，想法，复数 die Ideen；zeigen 展示）", "pl": "die Ideen"}], "grammar": "'Die Stadtwerke Jena feiern' — the plural subject takes the plural verb 'feiern'. 'es gibt' is the fixed 'there is/are' structure; 'einen extra Fördertopf' is Accusative (object of gibt). 'für das Jubiläum' uses 'für' + Accusative (purpose: for the anniversary). 'stärkt' is 3rd-person singular present of the regular verb 'stärken' (object 'neue Projekte' Accusative). 'auf der Plattform' uses 'auf' + Dative (location where). 'können' is a modal verb — its infinitive 'zeigen' moves to the end of the clause."}, {"source": "tagesschau (einfach)", "cat": "Einfache Deutsch", "url": "https://www.tagesschau.de/investigativ/ndr/medikamente-faelschungen-sicherheitsluecke-100.html", "date": "2026-08-21", "de": "Es gibt ein Problem bei Medikamenten-Packungen. Die Packungen haben eine gefährliche Sicherheitslücke. Kranke Menschen können sich verletzen. Die Behörden wollen die Packungen besser schützen.", "cn": "药品包装存在一个问题。这些包装有一个危险的安全漏洞。病人可能会受伤。有关部门想更好地保护这些包装。", "words": [{"w": "Es gibt ein Problem", "m": "有一个问题（das Problem 中性，问题；es gibt 固定句型'有'）", "pl": "die Probleme"}, {"w": "bei Medikamenten-Packungen", "m": "在药品包装处（die Medikamenten-Packung 女性，药品包装；die Medikamente 药品 + die Packung 包装）", "pl": "die Medikamenten-Packungen", "note": "bei + Dativ = at / in the case of"}, {"w": "Die Packungen", "m": "包装/盒子（die Packung 女性，包装，复数 die Packungen）", "pl": "die Packungen"}, {"w": "haben", "m": "有（haben 有，规则动词，复数 haben）", "pl": "—"}, {"w": "eine gefährliche Sicherheitslücke", "m": "一个危险的安全漏洞/安全缺口（die Sicherheitslücke 女性，安全漏洞；gefährlich 危险的，第四格 eine）", "pl": "die Sicherheitslücken"}, {"w": "Kranke Menschen", "m": "生病的人/病人（der Mensch 男性，人，复数 die Menschen；krank 生病的）", "pl": "die Menschen"}, {"w": "können sich verletzen", "m": "可能受伤（können 情态动词；sich verletzen 受伤，反身动词；verletzen 伤害）", "pl": "—", "note": "modal + reflexive infinitive at clause end"}, {"w": "Die Behörden", "m": "有关部门/当局（die Behörde 女性，部门/当局，复数 die Behörden）", "pl": "die Behörden"}, {"w": "wollen", "m": "想要（wollen 情态动词，复数 wollen；后接不定式 schützen 放句末）", "pl": "—", "note": "modal verb + infinitive at clause end"}, {"w": "besser schützen", "m": "更好地保护（besser 更好地/更好；schützen 保护）", "pl": "—"}], "grammar": "'Es gibt' = 'there is/are' (fixed structure). 'eine gefährliche Sicherheitslücke' is Accusative (object of 'haben'). 'können sich verletzen' — 'können' is a modal verb; the reflexive infinitive 'sich verletzen' goes to the end of the clause. 'wollen' is also modal — its infinitive 'schützen' moves to the end. Plural subjects ('Die Packungen', 'Kranke Menschen', 'Die Behörden') take plural verbs ('haben', 'können', 'wollen')."}, {"source": "tagesschau", "cat": "National", "url": "https://www.tagesschau.de/wissen/gesundheit/studie-aufmerksamkeit-juckreiz-100.html", "date": "2026-08-21", "de": "Eine Studie zeigt etwas Neues. Die Aufmerksamkeit kann Juckreiz lindern. Wenn man an etwas anderes denkt, juckt es weniger. Das hilft Menschen mit juckender Haut.", "cn": "一项研究展示了新发现。注意力能够缓解瘙痒。当人想着别的事情时，痒感会减轻。这有助于皮肤发痒的人。", "words": [{"w": "Eine Studie", "m": "一项研究（die Studie 女性，研究/调查；eine 不定冠词阴性）", "pl": "die Studien"}, {"w": "zeigt", "m": "展示/表明（zeigen 展示，规则动词，第三人称单数 zeigt）", "pl": "—"}, {"w": "etwas Neues", "m": "新东西/新发现（etwas 某物/一些；neu 新的，大写中性名词化 das Neue）", "pl": "—"}, {"w": "Die Aufmerksamkeit", "m": "注意力（die Aufmerksamkeit 女性，注意力，不可数）", "pl": "—"}, {"w": "kann", "m": "能/可以（können 情态动词，第三人称单数 kann；后接不定式 lindern 放句末）", "pl": "—", "note": "modal verb + infinitive at clause end"}, {"w": "Juckreiz lindern", "m": "缓解瘙痒（der Juckreiz 男性，瘙痒/发痒；lindern 缓解/减轻）", "pl": "die Juckreize"}, {"w": "Wenn man", "m": "当人…时/如果（wenn 当…时/如果；man 人们/人，不定代词主语）", "pl": "—"}, {"w": "an etwas anderes denkt", "m": "想着别的事情（denken an + 第四格 想/思考；anders 别的/其他的；denkt 第三人称单数）", "pl": "—", "note": "denken an + Akkusativ"}, {"w": "juckt es weniger", "m": "痒得更少/痒感减轻（jucken 发痒，无人称 es juckt；weniger 更少）", "pl": "—"}, {"w": "Das hilft", "m": "这有帮助（helfen 帮助，第三人称单数 hilft，接第三格）", "pl": "—", "note": "helfen + Dativ"}, {"w": "Menschen mit juckender Haut", "m": "皮肤发痒的人（der Mensch 男性，人；mit + 第三格 带着；die Haut 女性，皮肤；juckend 发痒的）", "pl": "die Menschen", "note": "mit + Dativ = with"}], "grammar": "'kann' is the modal verb 'können' (can) — its infinitive 'lindern' moves to the end of the clause. 'Wenn man an etwas anderes denkt' — 'denken an' takes Accusative ('an etwas anderes'); 'wenn' introduces a subordinate clause so the verb 'denkt' goes to the end. 'juckt es weniger' uses impersonal 'es juckt' (it itches), 'weniger' = less. 'hilft' is 3rd-person singular of 'helfen' (helps), which takes Dative ('Menschen'). 'mit juckender Haut' uses 'mit' + Dative."}]}</script>
