<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<title>Workbench</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<!-- iOS: add-to-home-screen behaves like an app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workbench">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<link rel="stylesheet" href="style.css">
<noscript><style>body{background:#0f1115;color:#e8ecf3;font-family:sans-serif;padding:40px}</style></noscript>
</head>
<body>
<!-- If style.css/app.js are missing (this file copied out on its own), show why
     instead of a blank page. JS removes it as soon as the app boots. -->
<div id="loaderr" style="position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;
  z-index:99999;background:#0f1115;color:#e8ecf3;overflow:auto;
  font:15px/1.7 -apple-system,'PingFang SC',sans-serif;padding:34px 24px;margin:0">
  <div style="max-width:460px;margin:8vh auto">
    <div style="font-size:38px;margin-bottom:14px">📄</div>
    <h2 style="margin:0 0 12px;font-size:19px">这个文件不能单独打开</h2>
    <p style="color:#8b94a6;margin:0 0 18px">
      <code>index.html</code> 需要同目录下的 <code>style.css</code>、<code>app.js</code> 和
      <code>data/</code> 文件夹，单独复制出来就会白屏。
    </p>
    <p style="margin:0 0 8px"><b>要发到手机 / 单独打开，请用：</b></p>
    <p style="background:#1d222b;border:1px solid #262c37;border-radius:10px;padding:12px 14px;margin:0">
      <b style="color:#5b9cff">workbench.html</b><br>
      <span style="color:#8b94a6;font-size:13px">同一个文件夹里，所有内容都打包在一个文件内，可直接 AirDrop / 微信发到手机。</span>
    </p>
  </div>
</div>
<header class="topbar">
  <button id="menuBtn" class="iconbtn" aria-label="menu">☰</button>
  <h1 id="title">工作台</h1>
  <button id="update-btn" class="ghost" hidden>检查更新</button>
</header>

<div class="layout">
  <div id="scrim" class="scrim"></div>
  <nav id="sidebar" class="sidebar">
    <div class="brand">Workbench</div>
    <button class="navitem active" data-view="ai"><span>🤖</span> AI 情报</button>
    <button class="navitem" data-view="de"><span>🇩🇪</span> 德语打卡</button>
    <button class="navitem" data-view="fc"><span>🃏</span> 单词翻页</button>
    <div class="spacer"></div>
    <div class="hint">数据由 Hermes 定时更新<br>可离线查看</div>
  </nav>

  <main class="content">
    <section id="view-ai" class="view active">
      <div class="viewhead">
        <h2>AI 情报</h2>
        <span class="headright">
          <span id="ai-date" class="muted"></span>
          <button id="ai-refresh" class="ghost">↻ 刷新</button>
        </span>
      </div>
      <div id="ai-list" class="cards"><div class="empty">加载中…</div></div>
    </section>

    <section id="view-de" class="view">
      <div class="viewhead">
        <h2>德语打卡 · A2</h2>
        <span class="headright">
          <span id="de-date" class="muted"></span>
          <span id="de-streak" class="pill">连续 0 天</span>
          <button id="de-refresh" class="ghost">↻ 刷新</button>
        </span>
      </div>
      <div id="de-list" class="cards"><div class="empty">加载中…</div></div>
      <button id="de-done" class="primary">✅ 今天完成打卡</button>
    </section>

    <section id="view-fc" class="view">
      <div class="viewhead">
        <h2>单词翻页</h2>
        <span class="muted">✔ <b id="fc-ok">0</b> · ✘ <b id="fc-no">0</b> · 剩 <b id="fc-left">0</b></span>
      </div>

      <div class="fcbar">
        <label>方向
          <select id="fc-dir">
            <option value="de2en">德 → 英</option>
            <option value="en2de">英 → 德</option>
            <option value="mix">混合</option>
          </select>
        </label>
        <label>范围
          <select id="fc-src">
            <option value="all">全部</option>
            <option value="news">打卡生词</option>
            <option value="A2">A2 常用</option>
            <option value="noun">只练名词冠词</option>
          </select>
        </label>
        <button id="fc-reset" class="ghost">重新开始</button>
      </div>

      <div id="fc-card" class="flashcard">
        <div class="fc-inner">
          <div class="fc-face fc-front">
            <div class="fc-q" id="fc-q">—</div>
            <div class="fc-hint" id="fc-hint"></div>
            <div id="fc-art" class="artrow" hidden>
              <button data-art="der">der</button>
              <button data-art="die">die</button>
              <button data-art="das">das</button>
            </div>
            <div class="fc-tap" id="fc-tap">点击卡片翻面</div>
          </div>
          <div class="fc-face fc-back">
            <div class="fc-a" id="fc-a">—</div>
            <div class="fc-extra" id="fc-extra"></div>
          </div>
        </div>
      </div>

      <div class="fcgrade" id="fc-grade" hidden>
        <button class="bad" data-g="0">✘ 不会</button>
        <button class="good" data-g="1">✔ 会了</button>
      </div>
      <p class="muted" id="fc-done" hidden>🎉 这一轮练完了，点「重新开始」再来一轮。</p>
    </section>
  </main>
</div>

<script id="embed-de" type="application/json">{"updated": "2026-08-19", "level": "A2", "mix": "Jena lokal · Einfache Deutsch · National", "items": [{"source": "Jenaer Nachrichten", "cat": "Jena lokal", "url": "https://www.jenaer-nachrichten.de/stadtleben/29598-nachhaltig-ins-neue-schuljahr-moehrchenhefte-fuer-grundschueler-in-jena", "date": "2026-08-19", "de": "In Jena bekommen Grundschüler zum Schulstart nachhaltige Hefte. Die Stadt verteilt 2.001 Exemplare an die Kinder. Die Hefte sind aus Recycling-Papier und schonen die Umwelt.", "cn": "在耶拿，小学生开学时会拿到可持续的练习本。市政府向孩子们发放了 2001 本。这些本子用再生纸做成，保护环境。", "words": [{"w": "In Jena", "m": "在耶拿（in = 在；Jena 耶拿，图林根城市名，专有名词中性）", "pl": "—"}, {"w": "bekommen", "m": "得到/收到（动词，规则变化：er/sie/es bekommt；此处复数 bekommen）", "pl": "—"}, {"w": "die Grundschüler", "m": "小学生（der Grundschüler 男性，小学生；Grundschule 小学 + Schüler 学生，复数 die Grundschüler）", "pl": "die Grundschüler"}, {"w": "zum Schulstart", "m": "在开学时（zum = zu dem；der Schulstart 男性，开学/学期开始）", "pl": "die Schulstarts", "note": "zu + Dativ as a temporal phrase"}, {"w": "nachhaltige Hefte", "m": "可持续的练习本（nachhaltig 可持续的，形容词；das Heft 中性，本子/练习册，复数 die Hefte）", "pl": "die Hefte"}, {"w": "Die Stadt", "m": "这座城市/市政府（die Stadt 女性，城市）", "pl": "die Städte"}, {"w": "verteilt", "m": "分发/发放（verteilen 分发，第三人称单数 verteilt）", "pl": "—"}, {"w": "2.001 Exemplare", "m": "2001 本/册（das Exemplar 中性，本/册/样本，复数 die Exemplare）", "pl": "die Exemplare"}, {"w": "an die Kinder", "m": "给孩子们（das Kind 中性，孩子，复数 die Kinder；an + 第四格表接收者‘给’）", "pl": "die Kinder", "note": "an + Akkusativ = to (recipient)"}, {"w": "aus Recycling-Papier", "m": "由再生纸制成（das Recycling-Papier 中性，再生纸；aus + 第三格表材料‘由…制成’）", "pl": "—", "note": "aus + Dativ = made of"}, {"w": "schonen", "m": "保护/爱护/节约（动词，此处指不伤害、保护）", "pl": "—"}, {"w": "die Umwelt", "m": "环境（die Umwelt 女性，环境，无复数）", "pl": "—"}], "grammar": "'bekommen' is a regular verb (plural 'bekommen' with the plural subject 'die Grundschüler'). 'zum Schulstart' uses 'zu + Dativ' as a temporal phrase ('at the start of school'). 'aus Recycling-Papier' uses 'aus' + Dative to express material ('made of'). 'an die Kinder' uses 'an' + Accusative for the indirect recipient ('to the children'). The plural noun 'die Hefte' has the same form in nominative and accusative."}, {"source": "nachrichtenleicht (DLF)", "cat": "Einfache Deutsch", "url": "https://www.nachrichtenleicht.de/russland-jabloko-verbot-100.html", "date": "2026-08-19", "de": "Ein russischer Politiker muss in ein Straflager. Er hat den Krieg in der Ukraine kritisiert. Die Regierung in Russland bestraft ihn dafür.", "cn": "一位俄罗斯政治家必须进劳改营。他批评了乌克兰的战争。俄罗斯的政府为此惩罚他。", "words": [{"w": "Ein russischer Politiker", "m": "一位俄罗斯政治家（der Politiker 男性，政治家；russisch 俄罗斯的；ein 不定冠词 阳性）", "pl": "die Politiker"}, {"w": "muss", "m": "必须（müssen 情态动词，第三人称单数 muss；后接不定式，此处‘进’gehen 省略）", "pl": "—", "note": "modal verb + (implied) infinitive"}, {"w": "in ein Straflager", "m": "进一个劳改营（das Straflager 中性，劳改营/惩罚营；in + 第四格表方向‘进到…里’）", "pl": "die Straflager", "note": "in + Akkusativ = direction into"}, {"w": "Er hat … kritisiert", "m": "他批评了（kritisieren 批评，现在完成时 hat kritisiert；er 他，第三人称单数）", "pl": "—", "note": "Perfekt: haben + Partizip II"}, {"w": "den Krieg", "m": "这场战争（der Krieg 男性，战争；第四格作 kritisieren 的宾语）", "pl": "die Kriege"}, {"w": "in der Ukraine", "m": "在乌克兰（die Ukraine 女性，乌克兰；in + 第三格表地点‘在…里’）", "pl": "—", "note": "in + Dativ = location where"}, {"w": "Die Regierung", "m": "政府（die Regierung 女性，政府）", "pl": "die Regierungen"}, {"w": "in Russland", "m": "在俄罗斯（Russland 中性，俄罗斯，专有名词无冠词）", "pl": "—"}, {"w": "bestraft", "m": "惩罚（bestrafen 惩罚，第三人称单数 bestraft）", "pl": "—"}, {"w": "ihn", "m": "他（人称代词 er 的第四格形式，作 bestrafen 的宾语）", "pl": "—", "note": "Accusative personal pronoun"}, {"w": "dafür", "m": "为此/因为这件事（da + für = 为此；da 指代前文‘批评战争’这件事）", "pl": "—", "note": "da(r)-prefix pronoun + für"}], "grammar": "'muss' is the modal verb 'müssen' (must) — its infinitive ('in ein Straflager gehen') is implied at the end. 'Er hat … kritisiert' is Perfekt with 'haben' + past participle. 'den Krieg' is Accusative (direct object of kritisieren). 'in der Ukraine' uses 'in' + Dative for location (where). 'ihn' is the Accusative personal pronoun replacing 'den Politiker'. 'dafür' = 'da' (there/that) + 'für' (for) = 'for that'."}, {"source": "tagesschau", "cat": "National", "url": "https://www.tagesschau.de/investigativ/ermittlungen-nordstream-generalbundesanwalt-100.html", "date": "2026-08-19", "de": "Die Polizei hat einen weiteren Verdächtigen festgenommen. Er soll die Nord-Stream-Pipeline angegriffen haben. Die Ermittlungen dauern noch an.", "cn": "警方逮捕了又一名嫌疑人。他应该（涉嫌）袭击了北溪管道。调查仍在进行中。", "words": [{"w": "Die Polizei", "m": "警方（die Polizei 女性，警察/警方，无复数）", "pl": "—"}, {"w": "hat … festgenommen", "m": "逮捕了（festnehmen 逮捕，现在完成时 hat festgenommen；可分动词前缀 fest- + nehmen）", "pl": "—", "note": "Perfekt of separable verb festnehmen"}, {"w": "einen weiteren Verdächtigen", "m": "又一名嫌疑人（der Verdächtige 男性，嫌疑人；ein 不定冠词；weiteren 进一步的/又一名，第四格）", "pl": "die Verdächtigen"}, {"w": "Er soll … angegriffen haben", "m": "他应该（涉嫌）袭击了（sollen 情态动词 + 完成时不定式；angegriffen haben = 袭击了，angreifen 袭击的过去分词）", "pl": "—", "note": "sollen + Perfekt-Infinitiv = reported/allegation"}, {"w": "die Nord-Stream-Pipeline", "m": "北溪管道（die Pipeline 女性，管道；Nord-Stream 北溪，专有名词）", "pl": "die Pipelines"}, {"w": "Die Ermittlungen", "m": "调查（die Ermittlung 女性，调查/侦查，复数 die Ermittlungen）", "pl": "die Ermittlungen"}, {"w": "dauern", "m": "持续（动词，持续/延续）", "pl": "—"}, {"w": "noch an", "m": "仍然/还在（noch 还/仍然；an 与 dauern 构成固定搭配 dauern an = 持续/进行中）", "pl": "—", "note": "dauern an = to continue (phrasal verb)"}], "grammar": "'hat … festgenommen' is Perfekt of the separable verb 'festnehmen' (the prefix 'fest-' moves to the end, participle 'festgenommen'). 'einen weiteren Verdächtigen' is Accusative (object of festnehmen). 'sollen + Perfekt-Infinitiv' (er soll … angegriffen haben) expresses reported speech / allegation ('he is said to have attacked'). 'die Ermittlungen' is plural, so 'dauern
